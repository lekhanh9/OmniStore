name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (e.g. v1.0.0). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out OmniStore
        uses: actions/checkout@v4

      - name: Check out local package dependencies
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/lekhanh9/ghost-code.git "$GITHUB_WORKSPACE/../ghost-code"
          git clone --depth 1 https://github.com/lekhanh9/ghost-sign.git "$GITHUB_WORKSPACE/../ghost-sign"
          git clone --depth 1 https://github.com/lekhanh9/minimuxer.git "$GITHUB_WORKSPACE/../minimuxer"

      - name: Show Swift version
        run: swift --version

      - name: Run core tests
        run: swift test

  ios:
    name: Build iOS app
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out OmniStore
        uses: actions/checkout@v4

      - name: Check out local package dependencies
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/lekhanh9/ghost-code.git "$GITHUB_WORKSPACE/../ghost-code"
          git clone --depth 1 https://github.com/lekhanh9/ghost-sign.git "$GITHUB_WORKSPACE/../ghost-sign"
          git clone --depth 1 https://github.com/lekhanh9/minimuxer.git "$GITHUB_WORKSPACE/../minimuxer"

      - name: Show tool versions
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve Xcode packages
        run: |
          xcodebuild \
            -project OmniStore.xcodeproj \
            -scheme OmniStore \
            -resolvePackageDependencies

      - name: Build iOS app
        run: |
          xcodebuild \
            -project OmniStore.xcodeproj \
            -scheme OmniStore \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  release:
    name: Publish unsigned IPA
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out OmniStore
        uses: actions/checkout@v4

      - name: Check out local package dependencies
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/lekhanh9/ghost-code.git "$GITHUB_WORKSPACE/../ghost-code"
          git clone --depth 1 https://github.com/lekhanh9/ghost-sign.git "$GITHUB_WORKSPACE/../ghost-sign"
          git clone --depth 1 https://github.com/lekhanh9/minimuxer.git "$GITHUB_WORKSPACE/../minimuxer"

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="$REF_TAG"
          fi
          if [[ ! "$TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"

      - name: Resolve Xcode packages
        run: |
          xcodebuild \
            -project OmniStore.xcodeproj \
            -scheme OmniStore \
            -resolvePackageDependencies

      - name: Build device app
        run: |
          xcodebuild \
            -project OmniStore.xcodeproj \
            -scheme OmniStore \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/OmniStore.app"
          if [[ ! -d "$APP" ]]; then
            echo "App bundle not found at $APP" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/Payload"
          /usr/bin/ditto "$APP" "$RUNNER_TEMP/Payload/OmniStore.app"
          cd "$RUNNER_TEMP"
          /usr/bin/zip -qry "OmniStore-${RELEASE_TAG}-unsigned.ipa" Payload
          echo "IPA_PATH=$RUNNER_TEMP/OmniStore-${RELEASE_TAG}-unsigned.ipa" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$IPA_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" "$IPA_PATH" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OmniStore $RELEASE_TAG" \
              --generate-notes
          fi
