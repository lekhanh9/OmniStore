name: OmniStore

options:
  bundleIdPrefix: com.omnistore
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "15.0"
  projectFormat: xcode15_0

packages:
  OmnistoreKit:
    path: "."

settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  OmniStore:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources/OmnistoreApp
      - path: Resources
    dependencies:
      - package: OmnistoreKit
        product: OmnistoreKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnistore.app
        PRODUCT_NAME: OmniStore
        INFOPLIST_FILE: Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Config/OmniStore.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        ENABLE_PREVIEWS: YES

schemes:
  OmniStore:
    build:
      targets:
        OmniStore: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
